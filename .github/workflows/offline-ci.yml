name: Offline CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: >-
        ${{ runner.temp }}/daily-report-agent-pycache-${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Check patch whitespace
        run: git diff --check

      - name: Compile Python sources outside the repository
        run: python -m compileall -q daily_report_agent scripts tests

      - name: Run offline tests
        run: python -m pytest -q

      - name: Confirm the tracked worktree is unchanged
        run: test -z "$(git status --short --untracked-files=all)"
