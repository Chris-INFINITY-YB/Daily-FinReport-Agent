# ============ 关注列表 ============
# market: us(美股) | cn(A股)
# symbol: 美股用 ticker(如 AAPL); A股用6位代码(如 600519)
# name: 可选, 仅用于报告展示; 留空则自动获取
watchlist:
  - {market: us, symbol: AAPL, name: 苹果}
  - {market: us, symbol: NVDA, name: 英伟达}
  - {market: cn, symbol: "600519", name: 贵州茅台}
  - {market: cn, symbol: "300750", name: 宁德时代}

# ============ 数据抓取 ============
data:
  news_days: 7        # 抓取最近几天的新闻
  max_news_per_stock: 15   # 每只股票喂给 LLM 的最大新闻条数(控成本)

# ============ 可选本地存储(默认关闭) ============
storage:
  enabled: false
  path: data/agent.db

# ============ LLM ============
llm:
  provider: deepseek           # deepseek | minimax | openai
  # 各 provider 的 base_url/model 预设; 也可手动覆盖 base_url / model
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.7
  max_tokens: 2000

# ============ 推送渠道(true 才启用, 凭据在 .env) ============
notify:
  email: false
  telegram: false
  serverchan: false
